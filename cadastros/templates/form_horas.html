{% extends "base.html" %}

{% block title %}{{ titulo }} - SMC{% endblock %}

{% block content %}
<div class="card" style="max-width: 650px; margin: 0 auto;">
    <div class="titulo-secao">
        <h2>{{ titulo }}</h2>
    </div>

    {% if colaborador_fixo %}
        <div class="aviso-visao" style="margin-bottom: 1.5rem;">
            Apontando horas para: <strong>{{ colaborador_fixo.nome_completo }}</strong> ({{ colaborador_fixo.cargo }})
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="acoes-formulario">
            <button type="submit" class="btn btn-sucesso">Salvar Apontamento</button>
            <a href="{% url 'lista_horas' %}" class="btn btn-secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
